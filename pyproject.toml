[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misago-pysoc-events-aggregator-plugin"
description = "Misago plugin that collects Python social events from RSS and HTML sources and publishes them as forum threads."
version = "0.1.0"
authors = [
    { name = "raydeal" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "httpx",
    "python-dateutil",
    "selectolax",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Message Boards",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build]
include = ["misago_pysoc_events_aggregator_plugin/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
