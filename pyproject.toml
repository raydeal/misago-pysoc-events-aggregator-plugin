[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misago-pysoc-events-aggregator-plugin"
description = "Misago plugin that collects Python social events from RSS and HTML sources and publishes them as forum threads."
version = "0.1.0"
authors = [
    { name = "raydeal" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "Django~=5.2",
    "feedparser",
    "httpx",
    "python-dateutil",
    "selectolax>=1.0",
]

[project.optional-dependencies]
test = [
    "coveralls",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "misago_pysoc_events_aggregator_plugin.tests.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
